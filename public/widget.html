<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pings</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./theme.css">
<script src="./settings.js"></script>
<script src="./gh.js"></script>
</head>
<body data-level="calm" data-view="normal" data-permits="0" data-offline="0">

<div id="top">
  <span id="conn" class="conn" title="conexión con el servidor"></span>
  <span id="clock" class="mini clock" hidden></span>
  <button id="mute" class="mini" type="button" aria-pressed="false">voz on</button>
</div>

<!-- A · vista normal -->
<main id="view-normal" class="view">
  <!-- El contador es CONTEXTO, no protagonista: la pregunta que importa no es
       "cuánto debes" sino "en cuál estás perdiendo más". La lista es el héroe. -->
  <header id="hero">
    <div id="ball-normal" class="ball-slot"></div>
    <div id="debt-wrap">
      <div id="debt-human" class="debt-human">Nadie te está esperando.</div>
      <div class="debt-line">
        <span id="debt" class="debt">0</span>
        <span class="debt-label">agent-min</span>
        <span id="debt-cost" class="debt-cost" hidden></span>
      </div>
    </div>
  </header>
  <!-- Solo de aquí para abajo hay scroll. Con la vista entera scrolleando, la barra
       nativa se le montaba encima a los botones de #top, y el titular —que es la
       promesa del producto— se iba con el scroll. El titular no se va. -->
  <div id="scroll">
  <section id="permits-normal" class="permits"></section>
  <!-- Pinta EXACTAMENTE el mismo string que dice la voz. Un solo texto, dos canales:
       así no hay nada que mantener sincronizado, y si el audio falla en el venue
       la escalada sigue siendo legible. -->
  <div id="bubble" class="bubble" hidden></div>
  <ul id="sessions" class="sessions"></ul>
  <p id="empty" class="empty" hidden>Conecta GitHub desde la página principal y te digo qué issue no tiene a nadie encima.</p>
  <!-- "Estás al día" es un callejón sin salida: te felicita y te deja sin nada que
       hacer. Cuando no hay deuda, lo útil es lo que NADIE empezó. -->
  <section id="libre" class="libre" hidden>
    <div class="libre-head">Y nadie está en esto</div>
    <ul id="libre-list" class="libre-list"></ul>
  </section>
  <!-- Lo que Pings aprobó solo mientras no estabas. Sin este registro, decidir
       por alguien sería abuso: aquí se rinde cuentas. -->
  <section id="auto" class="auto" hidden>
    <div class="auto-head">Decidí por ti mientras no estabas</div>
    <ul id="auto-list" class="auto-list"></ul>
  </section>
  </div>
</main>

<!-- Brief: a dónde volver -->
<section id="view-brief" class="view">
  <div class="brief-tag">Brief de vuelta</div>
  <div id="brief-head" class="brief-head">Cargando…</div>
  <ul id="brief-list" class="brief-list"></ul>
  <div class="brief-foot">
    <button id="brief-close" class="btn ghost" type="button">Volver al widget</button>
    <span id="brief-src" class="brief-src"></span>
  </div>
</section>

<script type="module">
// TODA la lógica vive aquí dentro. Los navegadores estrangulan los timers de la
// pestaña madre cuando está en segundo plano, que es justo el escenario que importa.
import { mount, setLevel } from './character.js';

const TOKEN = new URLSearchParams(location.search).get('token') || '';
const QT = encodeURIComponent(TOKEN);
const TOLL_GRACE_MS = 30_000;    // tras verlo, no vuelvas a caer en deuda alta enseguida

const $ = (id) => document.getElementById(id);

const S = {
  level: 'calm',
  totalWaitedMs: 0,
  agentesParados: 0,
  clock: 1,
  cost: null,
  presence: 'here',
  sessions: [],
  permits: [],
  auto: [],
  libres: [],
  libresAt: 0,
  view: 'normal',
  tollGraceUntil: 0,
  paying: false,
  offline: true,
  muted: localStorage.getItem('pings_mute') === '1',
  spoken: new Set(),
  audio: null,            // el <audio> de ElevenLabs sonando ahora, para poder cortarlo
  deadlines: new Map(),   // permitId -> timestamp absoluto de expiración
  resolved: new Set(),    // permisos que ya decidimos, para no re-pintarlos
  lastMinutes: -1,
};

// ── Utilidades de formato ───────────────────────────────────────────────────
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function agentMinutes(ms) {
  const m = Math.max(0, Number(ms) || 0) / 60000;
  return m >= 10 ? String(Math.round(m)) : m.toFixed(1);
}

function dur(ms) {
  const s = Math.max(0, Math.round((Number(ms) || 0) / 1000));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}

// `repo` de un permiso llega como cwd completo. En 360px de ancho solo cabe el final.
function basename(p) {
  const s = String(p == null ? '' : p).replace(/[\\/]+$/, '');
  if (!s) return 'sin-repo';
  return s.split(/[\\/]/).pop() || 'sin-repo';
}

const REASON_ES = {
  permission: 'pidió permiso',
  needs_input: 'necesita que decidas',
  completed: 'terminó, falta que confirmes',
  idle: 'lleva rato quieta',
  failed: 'falló',
};

function motivo(s) {
  if (s.status === 'stale') return 'sin señales hace rato';
  if (s.status === 'working') return 'trabajando';
  return REASON_ES[s.reason] || (s.status === 'done' ? 'terminó' : 'te está esperando');
}

// ── Voz ─────────────────────────────────────────────────────────────────────
const synth = typeof window !== 'undefined' ? window.speechSynthesis : null;
let voice = null;

function pickVoice() {
  try {
    const vs = (synth && synth.getVoices && synth.getVoices()) || [];
    voice =
      vs.find((v) => /^es[-_]ES/i.test(v.lang)) ||
      vs.find((v) => /^es[-_]MX/i.test(v.lang)) ||
      vs.find((v) => /^es/i.test(v.lang)) ||
      null;
  } catch (_) { voice = null; }
}
try {
  pickVoice();
  if (synth && synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice);
} catch (_) {}

// Voz del navegador: el suelo. Siempre disponible, no depende de la red.
function sayNative(t) {
  if (!synth) return;
  try {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = (voice && voice.lang) || 'es-ES';
    if (voice) u.voice = voice;
    u.rate = 1.03;
    u.pitch = 0.95;
    synth.speak(u);                            // autoplay bloqueado → falla en silencio
  } catch (_) {}
}

// ElevenLabs primero, navegador si falla. El servidor responde 204 sin key, 429
// si se pasó del rate limit; en ambos casos `r.ok` es false y caemos al suelo.
async function say(text) {
  const t = typeof text === 'string' ? text.trim() : '';
  if (!t || S.spoken.has(t)) return;          // nunca repetir lo ya dicho
  S.spoken.add(t);
  if (S.spoken.size > 400) S.spoken.clear();
  if (S.muted) return;
  try {
    const r = await fetch(`/api/voice?token=${QT}&text=${encodeURIComponent(t)}`);
    if (r.ok && r.status !== 204) {
      const a = new Audio(URL.createObjectURL(await r.blob()));
      a.addEventListener('ended', () => { try { URL.revokeObjectURL(a.src); } catch (_) {} });
      if (S.muted) return;                     // se apagó mientras sintetizaba
      S.audio = a;                             // referencia para poder cortarla
      await a.play();                          // si el autoplay lo bloquea, rechaza → catch
      return;
    }
  } catch (_) {}
  if (!S.muted) sayNative(t);
}

// Un solo texto, dos canales. `announce` deduplica ANTES de que say() marque el
// texto como dicho, así que la burbuja y la voz salen juntas y una sola vez.
let bubbleTimer = null;
function announce(text) {
  const t = typeof text === 'string' ? text.trim() : '';
  if (!t || S.spoken.has(t)) return;
  showBubble(t);
  say(t);
}

function showBubble(text) {
  const b = $('bubble');
  b.textContent = text;
  b.hidden = false;
  void b.offsetWidth;            // reinicia la animación de entrada
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => {
    b.classList.remove('show');
    setTimeout(() => { if (!b.classList.contains('show')) b.hidden = true; }, 400);
  }, 9000);
}

// El widget vive en un iframe dentro de la PiP. El clic que abrió la ventana
// ocurrió en la pestaña MADRE, así que este documento nunca recibió un gesto y el
// navegador bloquea el audio — y como todo va en try/catch, fallaba en silencio.
// Basta un gesto acá dentro para desbloquear el canal. Cualquier clic sirve.
let audioListo = false;
function desbloquearAudio() {
  if (audioListo) return;
  audioListo = true;
  try {
    const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
    a.volume = 0;
    a.play().catch(() => {});
  } catch (_) {}
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    if (synth) synth.speak(u);
  } catch (_) {}
  document.body.dataset.audio = '1';
  paintMute();
}
addEventListener('pointerdown', desbloquearAudio, { once: true });
addEventListener('keydown', desbloquearAudio, { once: true });

function paintMute() {
  $('mute').textContent = S.muted ? 'voz off' : (audioListo ? 'voz on' : 'toca para oír');
  $('mute').setAttribute('aria-pressed', S.muted ? 'true' : 'false');
}
$('mute').addEventListener('click', () => {
  S.muted = !S.muted;
  localStorage.setItem('pings_mute', S.muted ? '1' : '0');
  if (S.muted) {
    try { synth && synth.cancel(); } catch (_) {}
    try { S.audio && S.audio.pause(); S.audio = null; } catch (_) {}
  }
  paintMute();
});
paintMute();

// ── Listas con reconciliación por clave (sin innerHTML, sin parpadeo) ───────
function syncList(container, items, keyOf, build) {
  const map = container._nodes || (container._nodes = new Map());
  const seen = new Set();
  let prev = null;
  for (const item of items) {
    const k = keyOf(item);
    seen.add(k);
    let rec = map.get(k);
    if (!rec) { rec = build(item); map.set(k, rec); }
    rec.update(item);
    const target = prev ? prev.nextSibling : container.firstChild;
    if (rec.el !== target) container.insertBefore(rec.el, target);
    prev = rec.el;
  }
  for (const [k, rec] of map) {
    if (!seen.has(k)) { rec.el.remove(); map.delete(k); }
  }
}

function clearList(container) {
  if (container._nodes) container._nodes.clear();
  container.replaceChildren();
}

// ── VISTA B · tarjeta de permiso ────────────────────────────────────────────
function buildPermit() {
  const root = el('article', 'permit');

  const top = el('div', 'permit-top');
  const tag = el('span', 'permit-tag', 'PERMISO');
  const who = el('span', 'permit-who');
  const clock = el('span', 'permit-clock');
  top.append(tag, who, clock);

  const tool = el('div', 'permit-tool');
  const input = el('pre', 'permit-input');
  const advice = el('div', 'permit-advice');
  advice.hidden = true;

  // Colisión: otro agente está tocando este mismo archivo AHORA. Va encima del
  // consejo de la IA porque es un hecho, no una opinión.
  const clash = el('div', 'permit-clash');
  clash.hidden = true;

  const actions = el('div', 'permit-actions');
  const allow = el('button', 'btn allow', 'Permitir');
  const deny = el('button', 'btn deny', 'Denegar');
  allow.type = 'button';
  deny.type = 'button';
  actions.append(allow, deny);

  const err = el('div', 'permit-err');
  err.hidden = true;

  const bar = el('div', 'permit-bar');
  const fill = el('i');
  bar.appendChild(fill);

  root.append(top, tool, input, clash, advice, actions, err, bar);

  let id = null;

  async function decide(decision) {
    if (!id) return;
    allow.disabled = true;
    deny.disabled = true;
    err.hidden = true;
    try {
      // El token es obligatorio: aprobar un permiso ejecuta algo en la máquina de alguien.
      const r = await fetch(`/api/permit/${encodeURIComponent(id)}?token=${QT}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decision }),
      });
      // 404 = el permiso venció y el agente ya cayó al prompt normal. No es un error.
      const done = r.ok;
      S.resolved.add(id);
      S.deadlines.delete(id);
      root.dataset.gone = '1';
      setTimeout(() => { dropPermit(id); }, done ? 260 : 60);
    } catch (_) {
      allow.disabled = false;
      deny.disabled = false;
      err.hidden = false;
      err.textContent = 'Sin conexión. Intenta otra vez.';
    }
  }

  allow.addEventListener('click', () => decide('allow'));
  deny.addEventListener('click', () => decide('deny'));

  function update(p) {
    id = p.id;
    root.dataset.permitId = p.id;
    who.textContent = `${p.who || 'alguien'} · ${basename(p.repo)}`;
    tool.textContent = p.tool || 'herramienta desconocida';
    input.textContent = p.input == null || p.input === '' ? '(sin argumentos)' : String(p.input);

    const c = p.collision;
    if (c && c.who) {
      const mins = Math.max(1, Math.round((Number(c.agoMs) || 0) / 60000));
      clash.hidden = false;
      clash.replaceChildren(
        el('b', null, '⚠ COLISIÓN'),
        document.createTextNode(` — ${c.who} lleva ${mins} min tocando este mismo archivo`),
      );
    } else {
      clash.hidden = true;
      clash.replaceChildren();
    }

    const a = p.advice;
    if (a && (a.verdict === 'deny' || a.verdict === 'allow')) {
      advice.hidden = false;
      advice.className = 'permit-advice ' + a.verdict;
      advice.replaceChildren(
        el('b', null, a.verdict === 'deny' ? 'IA recomienda DENEGAR' : 'IA recomienda PERMITIR'),
        document.createTextNode(a.why ? ' — ' + a.why : ''),
      );
    } else {
      advice.hidden = true;
      advice.replaceChildren();
    }
    tickPermit(root, p.id);
  }

  return { el: root, update };
}

// Cuenta regresiva local: el servidor manda expiresInMs 1 vez por segundo,
// esto lo interpola para que la barra se vea drenar de verdad.
function tickPermit(root, id) {
  const deadline = S.deadlines.get(id);
  if (!deadline) return;
  const left = Math.max(0, deadline - Date.now());
  const pct = Math.max(0, Math.min(100, (left / 85000) * 100));
  const fill = root.querySelector('.permit-bar > i');
  if (fill) fill.style.width = pct.toFixed(1) + '%';
  const clock = root.querySelector('.permit-clock');
  if (clock) clock.textContent = Math.ceil(left / 1000) + 's';
  root.dataset.urgent = left <= 15000 ? '1' : '0';
}

function dropPermit(id) {
  S.deadlines.delete(id);
  S.permits = S.permits.filter((p) => p.id !== id);
  renderPermits();
  applyPermitFlag();
}

function activePermits() {
  const now = Date.now();
  return S.permits.filter((p) => {
    if (S.resolved.has(p.id)) return false;
    const d = S.deadlines.get(p.id);
    return d == null || d > now;
  });
}

function renderPermits() {
  // Una sola vista: los permisos van siempre arriba de la lista. Antes había que
  // decidir en cuál de dos sitios pintarlos, y en la de deuda alta se mostraba
  // solo el primero — una restricción que existía porque ahí había que "salir".
  syncList($('permits-normal'), activePermits(), (p) => p.id, buildPermit);
}

// ── VISTA A · sesiones ──────────────────────────────────────────────────────
// Cada fila responde las tres preguntas del producto, en este orden visual:
// cuánto te cuesta · por qué está parada · qué hacer.
function buildSession() {
  const root = el('li', 'sess');

  const rank = el('span', 'rank');

  const main = el('div', 'sess-main');
  // El titular es CÓMO SE LLAMA la sesión, no el repo: con dos conversaciones en
  // el mismo repo, el repo no distingue nada. El repo baja a subtítulo.
  const head = el('div', 'sess-head');
  const where = el('div', 'sess-where');
  const repo = el('span', 'sess-repo');
  const who = el('span', 'sess-who');
  where.append(repo, who);
  const why = el('div', 'sess-why');
  const action = el('div', 'sess-action');
  const msg = el('div', 'sess-msg');
  // Avance solo cuando el agente lleva lista de tareas. Sin datos no se pinta:
  // un 0% inventado es peor que no decir nada.
  const prog = el('div', 'sess-prog');
  const progBar = el('i');
  const progTxt = el('span');
  prog.append(progBar, progTxt);
  prog.hidden = true;
  main.append(head, where, prog, why, action, msg);

  const cost = el('div', 'sess-cost');
  const costN = el('b');
  const costU = el('span', null, 'agent-min');
  cost.append(costN, costU);

  root.append(rank, main, cost);

  function update(s) {
    root.dataset.status = s.status || 'working';
    root.dataset.reason = s.reason || '';   // theme.css colorea la fila por estado
    root.dataset.loop = Number(s.loopCount) >= 1 ? '1' : '0';

    rank.textContent = s.rank ? String(s.rank) : '';
    rank.hidden = !s.rank;

    head.textContent = s.label || basename(s.repo);
    head.title = s.label || '';
    repo.textContent = basename(s.repo);
    who.textContent = s.who ? ' · ' + s.who : '';

    // El costo es el protagonista de la fila: es la pregunta que el producto responde.
    const ms = Number(s.costMs ?? s.waitedMs) || 0;
    const mult = Number(s.blockedAgents) > 1 ? ` (${s.blockedAgents} agentes)` : '';
    cost.hidden = ms <= 0;
    costN.textContent = agentMinutes(ms);
    costU.textContent = 'agent-min' + mult;

    const pr = s.progress;
    if (pr && pr.total > 0) {
      prog.hidden = false;
      progBar.style.width = Math.min(100, Math.max(0, pr.pct)) + '%';
      progTxt.textContent = `${pr.pct}% · ${pr.done} de ${pr.total} tareas`;
      prog.dataset.casi = pr.pct >= 80 ? '1' : '0';
    } else {
      prog.hidden = true;
    }

    why.textContent = s.why || motivo(s);

    const act = Number(s.loopCount) >= 1 ? 'Se está dando vueltas: ciérrala' : s.action;
    action.textContent = act ? '→ ' + act : '';
    action.hidden = !act;

    msg.textContent = s.lastMessage ? String(s.lastMessage) : '';
    msg.hidden = !s.lastMessage;
  }

  return { el: root, update };
}

function buildAutoItem() {
  const root = el('li', 'auto-item');
  const tick = el('span', 'auto-tick', '✓');
  const main = el('div');
  const what = el('div', 'auto-what');
  const why = el('div', 'auto-why');
  main.append(what, why);
  root.append(tick, main);

  function update(a) {
    what.textContent = `${a.tool} ${a.input || ''}`.trim();
    why.textContent = `${a.repo || ''} · ${a.razon || ''}`;
  }
  return { el: root, update };
}

// El piloto automático solo aprueba lo de la lista blanca, pero eso no lo exime
// de rendir cuentas: todo lo que decidió se muestra al volver.
function renderAuto() {
  const box = $('auto');
  const items = S.auto || [];
  box.hidden = items.length === 0;
  if (!items.length) { clearList($('auto-list')); return; }
  syncList($('auto-list'), items, (a) => a.at + ':' + a.sessionId, buildAutoItem);
}

function buildLibre() {
  const root = el('li', 'libre-item');
  const num = el('span', 'libre-num');
  const main = el('div');
  const tit = el('div', 'libre-tit');
  const meta = el('div', 'libre-meta');
  main.append(tit, meta);
  root.append(num, main);

  function update(i) {
    num.textContent = '#' + i.numero;
    tit.textContent = i.titulo || '(sin título)';
    meta.textContent = [i.repo, i.esPR ? 'PR' : null, i.asignado ? 'asignado a ' + i.asignado : null]
      .filter(Boolean).join(' · ');
  }
  return { el: root, update };
}

// Solo se consulta cuando NO hay deuda: es la respuesta a "estás al día, ¿y ahora
// qué?". Con agentes esperándote, lo urgente es la lista, no lo que falta empezar.
async function cargarLibres() {
  const ahora = Date.now();
  if (ahora - S.libresAt < 60_000) return;
  S.libresAt = ahora;
  try {
    // GitHub lo consulta EL NAVEGADOR con tu PAT. Al servidor solo le mandamos
    // los títulos para el emparejamiento semántico: la credencial no viaja.
    if (typeof PINGS_GH === 'undefined' || !PINGS_GH.configurado()) { S.libres = []; return; }
    const { items } = await PINGS_GH.traer();
    if (!items.length) { S.libres = []; renderLibres(); return; }
    const r = await fetch(`/api/emparejar?token=${QT}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ issues: items }),
    });
    if (!r.ok) return;
    const d = await r.json();
    S.libres = Array.isArray(d.sinNadie) ? d.sinNadie.slice(0, 5) : [];
    renderLibres();
  } catch (_) {}
}

function renderLibres() {
  const box = $('libre');
  const ocioso = S.agentesParados === 0 && !activePermits().length;
  const hay = ocioso && S.libres.length > 0;
  box.hidden = !hay;
  if (hay) syncList($('libre-list'), S.libres, (i) => i.repo + '#' + i.numero, buildLibre);
  else clearList($('libre-list'));
  // El renglón de vacío depende de si esta sección quedó visible, así que se
  // repinta acá: renderLibres corre después de renderSessions y también sola,
  // cuando vuelve la consulta a GitHub.
  pintarVacio();
}

function renderSessions() {
  // El ranking numera solo lo que TE ESTÁ COSTANDO. Las sesiones trabajando van
  // debajo, sin número: son contexto, no deuda.
  let n = 0;
  const conRank = S.sessions.map((s) => {
    const cuenta = s.status === 'waiting' || s.status === 'done';
    return { ...s, rank: cuenta ? ++n : 0 };
  });
  syncList($('sessions'), conRank, (s) => s.sessionId, buildSession);
  pintarVacio();
}

// El hero ya dice "Estás al día" cuando no hay deuda: repetirlo abajo gastaba el
// cuadro entero —el primero que se ve— en decir dos veces lo mismo. Este renglón
// solo aparece si no hay NADA que mostrar, y entonces dice cómo conseguirlo.
function pintarVacio() {
  const nodo = $('empty');
  if (!TOKEN) {
    nodo.textContent = 'Sin token: abre el widget desde la página principal.';
    nodo.hidden = false;
    return;
  }
  if (S.sessions.length > 0 || !$('libre').hidden) { nodo.hidden = true; return; }
  const gh = typeof PINGS_GH !== 'undefined' && PINGS_GH.configurado();
  nodo.textContent = gh
    ? 'Todo issue abierto ya tiene a alguien encima. Arranca uno nuevo.'
    : 'Conecta GitHub desde la página principal y te digo qué issue no tiene a nadie encima.';
  nodo.hidden = false;
}

// ── Deuda ───────────────────────────────────────────────────────────────────
function renderDebt() {
  const txt = agentMinutes(S.totalWaitedMs);
  const node = $('debt');
  if (node.textContent !== txt) node.textContent = txt;

  // Sujeto, verbo, culpable. "3 agent-minutos" no significa nada a los 3 segundos;
  // "4 agentes llevan 3 minutos esperándote a ti" sí.
  const n = S.agentesParados;
  const min = Math.max(1, Math.round(S.totalWaitedMs / 60000 / Math.max(1, n)));
  // Sin deuda NO se dice "estás al día": felicitar es un callejón sin salida y deja
  // la ventana sin trabajo que hacer. Se dice cuánta capacidad tienes libre, que es
  // una invitación a usarla. La lista de abajo dice en qué.
  const trabajando = S.sessions.filter((s) => s.status === 'working').length;
  const frase = n === 0
    ? (trabajando > 0
        ? `Nadie te espera: ${trabajando} ${trabajando === 1 ? 'agente avanza solo' : 'agentes avanzan solos'}. Puedes abrir otro frente.`
        : 'No tienes ningún agente corriendo. Toda tu capacidad está sin usar.')
    : `${n} ${n === 1 ? 'agente lleva' : 'agentes llevan'} ${min} ${min === 1 ? 'minuto' : 'minutos'} esperándote a ti.`;
  if ($('debt-human').textContent !== frase) $('debt-human').textContent = frase;

  // Esperar no quema tokens: esto es capacidad paralela perdida, y se dice así.
  const cost = $('debt-cost');
  if (S.cost && S.cost.idleUsd >= 0.01) {
    const t = `≈ $${S.cost.idleUsd.toFixed(2)} de capacidad parada (a $${S.cost.rateUsdHour}/h)`;
    if (cost.textContent !== t) cost.textContent = t;
    cost.hidden = false;
  } else {
    cost.hidden = true;
  }

  // Si el reloj va acelerado, se dice de frente. Una demo honesta pega más.
  const clk = $('clock');
  if (S.clock > 1) {
    const t = `reloj ${S.clock}×`;
    if (clk.textContent !== t) clk.textContent = t;
    clk.hidden = false;
  } else {
    clk.hidden = true;
  }

  const mins = Math.floor(S.totalWaitedMs / 60000);
  if (mins > S.lastMinutes && S.lastMinutes >= 0) {
    node.classList.remove('bump');
    void node.offsetWidth;   // reinicia la animación
    node.classList.add('bump');
  }
  S.lastMinutes = mins;
}

function applyPermitFlag() {
  document.body.dataset.permits = activePermits().length > 0 ? '1' : '0';
}

function setView(view) {
  if (S.view === view) return;
  S.view = view;
  document.body.dataset.view = view;
  renderPermits();
}

// ── VISTA C · pings ─────────────────────────────────────────────────────────
// En deuda alta el brief aparece SOLO. La pantalla intermedia era el último resto
// del bloqueo que quitamos: sin bloquear, era un cartel rojo con un botón para
// pedir lo único que el producto promete hacer por sí mismo.
function enterToll() {
  announce(Math.round(S.totalWaitedMs / 60000) + ' agent-minutos parados. Te digo a cuál volver.');
  mostrarBrief();
}

async function mostrarBrief() {
  if (S.paying) return;
  S.paying = true;
  S.tollGraceUntil = Date.now() + TOLL_GRACE_MS;
  setView('brief');
  $('brief-head').textContent = 'Reconstruyendo qué estaba pasando…';
  clearList($('brief-list'));
  $('brief-src').textContent = '';

  // El brief se pide ANTES de resetear: /api/toll/complete pone since=now en todas
  // las sesiones, así que después del reset el ranking sale con "1 min" en todo y
  // pierde justo lo que lo hace útil. Ambas llamadas se hacen igual, en este orden.
  let brief = null;
  try {
    const r = await fetch(`/api/brief?token=${QT}`);
    brief = await r.json();
  } catch (_) {}

  // Ojo: acá NO se resetea la deuda. Resetear significa "ya volví", y eso lo
  // decides tú al cerrar el brief — no puede pasar por el solo hecho de mirarlo.
  renderBrief(brief);
  S.paying = false;
  S.tollGraceUntil = Date.now() + TOLL_GRACE_MS;
}


// ── Brief ───────────────────────────────────────────────────────────────────
function buildBriefItem() {
  const root = el('li', 'brief-item');
  const rank = el('span', 'brief-rank');
  const head = el('div', 'brief-headline');
  const tag = el('span', 'brief-tagchip');
  const who = el('div', 'brief-who');
  const whoRepo = el('b');
  const whoRest = el('span');
  who.append(whoRepo, whoRest);
  const why = el('div', 'brief-why');
  const action = el('div', 'brief-action');
  root.append(rank, head, tag, who, why, action);

  // La etiqueta es lo que el ranking mecánico no puede decir: no que está
  // esperando, sino CÓMO tratarla.
  const TAGS = {
    casi_lista: 'casi lista',
    bloqueada: 'bloqueada',
    en_loop: 'en loop',
    cara_de_retomar: 'cara de retomar',
    ya_no_importa: 'ya no importa',
  };

  function update(item) {
    rank.textContent = String(item._i);
    head.textContent = item.label || basename(item.repo);
    const t = TAGS[item.tag];
    tag.textContent = t || '';
    tag.hidden = !t;
    tag.dataset.tag = item.tag || '';
    whoRepo.textContent = basename(item.repo);
    whoRest.textContent = ` · ${item.who || 'alguien'} · ${item.minutes != null ? item.minutes + ' agent-min' : '—'}`;
    why.textContent = item.why ? String(item.why) : 'esperando';
    action.textContent = item.action ? '→ ' + String(item.action) : '';
    action.hidden = !item.action;
  }

  return { el: root, update };
}

function renderBrief(brief) {
  const b = brief && typeof brief === 'object' ? brief : {};
  const items = Array.isArray(b.items) ? b.items : [];
  $('brief-head').textContent = b.headline
    ? String(b.headline)
    : items.length
      ? 'Esto es lo que te espera.'
      : 'No pude cargar el brief, pero la deuda quedó saldada.';
  $('brief-src').textContent = b.source ? 'fuente: ' + String(b.source) : '';
  const withIndex = items.map((it, i) => Object.assign({ _i: i + 1 }, it));
  syncList($('brief-list'), withIndex, (it) => it.sessionId || 'i' + it._i, buildBriefItem);
  say(b.headline ? String(b.headline) : '');
}

// Cerrar el brief es el gesto de "ya volví": ahí sí se salda la deuda.
$('brief-close').addEventListener('click', async () => {
  S.tollGraceUntil = Math.max(S.tollGraceUntil, Date.now() + TOLL_GRACE_MS);
  try { await fetch(`/api/toll/complete?token=${QT}`, { method: 'POST' }); } catch (_) {}
  setView('normal');
  applyPermitFlag();
});

// ── Render principal ────────────────────────────────────────────────────────
function render(snap) {
  S.totalWaitedMs = Number(snap.totalWaitedMs) || 0;
  S.level = ['calm', 'nudge', 'angry', 'toll'].includes(snap.level) ? snap.level : 'calm';
  S.sessions = Array.isArray(snap.sessions) ? snap.sessions : [];
  S.agentesParados = Number(snap.agentesParados) || 0;
  S.clock = Number(snap.clock) || 1;
  S.presence = snap.presence === 'away' ? 'away' : 'here';
  S.auto = Array.isArray(snap.auto) ? snap.auto : [];
  S.cost = snap.cost && typeof snap.cost === 'object' ? snap.cost : null;

  const incoming = Array.isArray(snap.permits) ? snap.permits : [];
  const now = Date.now();
  for (const p of incoming) {
    const ms = Number(p.expiresInMs);
    if (Number.isFinite(ms)) S.deadlines.set(p.id, now + Math.max(0, ms));
  }
  const live = new Set(incoming.map((p) => p.id));
  for (const id of [...S.deadlines.keys()]) if (!live.has(id)) S.deadlines.delete(id);
  for (const id of [...S.resolved]) if (!live.has(id)) S.resolved.delete(id);
  S.permits = incoming;

  document.body.dataset.level = S.level;
  setLevel(S.level);
  applyPermitFlag();
  renderDebt();
  renderSessions();
  renderAuto();
  if (S.agentesParados === 0) cargarLibres();
  renderLibres();
  renderPermits();

  // Con la deuda alta el brief aparece solo, sin pantalla intermedia.
  // Estando fuera no se avisa: no hay nadie a quien avisarle. La deuda queda
  // congelada y el brief salta en cuanto vuelves, que es cuando sirve.
  if (S.level === 'toll' && S.view === 'normal' && !S.paying && now >= S.tollGraceUntil
      && S.presence !== 'away') {
    enterToll();
  }

  if (typeof snap.speak === 'string') announce(snap.speak);
}

// ── Stream ──────────────────────────────────────────────────────────────────
// Escritura incondicional a propósito: el estado inicial de S y el del DOM no
// tienen por qué coincidir, y un guard de "si no cambió, no hagas nada" se comía
// el primer error (el caso justo en que el punto rojo tiene que aparecer).
function setOffline(v) {
  S.offline = v;
  document.body.dataset.offline = v ? '1' : '0';
  $('conn').title = v ? 'sin conexión — reconectando' : 'conectado';
}

let es = new EventSource(`/events${location.search}`);   // reenvía token + ajustes

// Los ajustes viven en localStorage y viajan en la query, así que una ventana ya
// abierta se quedaba con los viejos hasta cerrarla. El iframe de la PiP es del
// mismo origen, así que sí recibe `storage` cuando la landing escribe: se
// reconstruye la query desde ahí y se reconecta el stream. Sin recargar nada.
addEventListener('storage', (e) => {
  if (!e.key || !e.key.startsWith('pings_')) return;
  if (typeof PINGS === 'undefined' || !PINGS.query) return;
  const nueva = `/events?${PINGS.query(TOKEN)}`;
  if (nueva === es.url.replace(location.origin, '')) return;
  try { es.close(); } catch (_) {}
  history.replaceState(null, '', `/widget.html?${PINGS.query(TOKEN)}`);
  S.spoken.clear();                 // otro tono es otro texto: hay que poder decirlo
  es = conectar(nueva);
});

function conectar(url) {
  const src = new EventSource(url);
  src.addEventListener('open', () => setOffline(false));
  src.addEventListener('error', () => setOffline(true));
  src.addEventListener('message', (e) => {
    try { render(JSON.parse(e.data)); } catch (_) {}
  });
  return src;
}
es.addEventListener('open', () => setOffline(false));
es.addEventListener('error', () => setOffline(true));   // EventSource reconecta solo
es.addEventListener('message', (e) => {
  setOffline(false);
  let snap;
  try { snap = JSON.parse(e.data); } catch (_) { return; }
  if (!snap || typeof snap !== 'object') return;
  try { render(snap); } catch (err) { console.error('render', err); }
});

// ── Relojes locales ─────────────────────────────────────────────────────────
setInterval(() => {
  const now = Date.now();
  for (const [id, deadline] of S.deadlines) {
    const node = document.querySelector(`.permit[data-permit-id="${CSS.escape(id)}"]`);
    if (node) tickPermit(node, id);
    if (deadline <= now) dropPermit(id);   // venció: el agente cae al prompt normal
  }
}, 200);

// El free tier de Render se duerme. Mientras el widget esté abierto, no.
setInterval(() => { fetch('/healthz').catch(() => {}); }, 10 * 60 * 1000);

// ── Arranque ────────────────────────────────────────────────────────────────
mount($('ball-normal'));
setLevel('calm');
pintarVacio();   // sin token, sin sesiones o sin GitHub: cada caso dice algo distinto
</script>
</body>
</html>
